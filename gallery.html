<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-bar">
        <a href="birthday.html" class="brand">♡ Birthday</a>
        <nav class="nav-links">
          <a href="birthday.html">Home</a>
          <a href="memories.html">Memories</a>
          <a href="gallery.html">Gallery</a>
          <a href="love-letter.html">Letter</a>
          <a href="our-journey.html">Journey</a>
          <a href="final-surprise.html">Finale</a>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <div class="section-heading center">
          <p class="eyebrow">A collection of our favorite moments</p>
          <h2>Love in pictures</h2>
        </div>

        <div class="photo-grid">
          <figure class="photo-card">
            <img src="images/photo1.svg" alt="Couple memory 1" />
            <figcaption>Our chapter one</figcaption>
          </figure>
          <figure class="photo-card">
            <img src="images/photo2.svg" alt="Couple memory 2" />
            <figcaption>Sweet little moments</figcaption>
          </figure>
          <figure class="photo-card">
            <img src="images/photo3.svg" alt="Couple memory 3" />
            <figcaption>Joyful laughter</figcaption>
          </figure>
          <figure class="photo-card">
            <img src="images/photo4.svg" alt="Couple memory 4" />
            <figcaption>Forever and always</figcaption>
          </figure>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>
          Replace the placeholders with your real photos to make it even more
          personal.
        </p>
      </div>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
