<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Album | For Nitya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="gallery">
  <header id="site-header" class="site-header"></header>

  <main>
    <section class="page-head center">
      <p class="eyebrow">A collection of my favourite moments</p>
      <h1 class="display">Love in <em>Pictures</em></h1>
      <p class="lead">Tap any photo to see it full screen.</p>
    </section>

    <div class="container">
      <section class="gallery" id="gallery" aria-label="Photo album"></section>
    </div>
  </main>

  <footer class="site-footer">Every picture holds a piece of my heart ❤️</footer>
  <script src="js/script.js"></script>
</body>
</html>
